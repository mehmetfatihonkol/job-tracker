<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Tracker{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Job Tracker</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/applications" {% if request.url.path.startswith('/applications') %}aria-current="page"{% endif %}>Başvurular</a>
      <a href="/paste" {% if request.url.path == '/paste' %}aria-current="page"{% endif %}>Toplu yapıştır</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
