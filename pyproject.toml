[project]
name = "job-tracker"
version = "0.1.0"
description = "Local-first job application tracker with an analytics dashboard and LLM-assisted listing import."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openai>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return
    "PTH",     # use pathlib
    "ARG",     # unused arguments
    "RUF",     # ruff-specific
]
allowed-confusables = ["–", "ı", "İ", "·"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
